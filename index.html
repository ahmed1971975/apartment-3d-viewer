<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Apartment Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            max-width: 300px;
        }
        #controls h3 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        #controls p {
            margin: 5px 0;
            line-height: 1.6;
        }
        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        #videoContainer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            z-index: 10;
        }
        video {
            max-width: 400px;
            max-height: 300px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>🏠 3D Apartment Viewer</h3>
        <p><strong>Dimensions:</strong> 11.6m × 11.3m</p>
        <p><strong>Ceiling Height:</strong> 2.8m</p>
        <hr style="margin: 10px 0; opacity: 0.3;">
        <p><strong>Controls:</strong></p>
        <p>🖱️ Drag to look around</p>
        <p>⬆️⬇️⬅️➡️ Move</p>
        <p>SPACE: Up | CTRL: Down</p>
        <button onclick="goToRoom('living')">Living Room</button>
        <button onclick="goToRoom('kitchen')">Kitchen</button>
        <button onclick="goToRoom('bedroom1')">Bedroom 1</button>
        <button onclick="goToRoom('bedroom2')">Bedroom 2</button>
        <button onclick="startWalkthrough()">▶️ Start Tour</button>
        <button onclick="resetView()">Reset View</button>
    </div>
    
    <div id="info">
        <p>📍 Use mouse to look around | WASD to move</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="apartment.js"></script>
</body>
</html>
